# On-demand gfx1151 benchmark history for the AMD DevLab Dispatch pool. Every run is kept, and
# a GitHub Pages site shows all of them: a summary to compare runs over time, and one page per run.
#
# Dispatch: Actions -> "Benchmark gfx1151 history (on-demand)" -> "Use workflow from: master", then
# set `ref` to the branch, tag or SHA to measure. The `ref` input drives the checkout, so any ref can
# be measured, also one that does not carry this file. With `ref` empty the lane measures the commit
# it was dispatched on. workflow_dispatch only works once this file is on the default branch.
#
# One run does:
#   1. builds llama-bench, llama-perplexity and llama-server for HIP (gfx1151), and llama-bench and
#      llama-perplexity for Vulkan, with the bench-gfx1151.yml recipe
#   2. runs llama-bench on the pinned models over the ubatch x depth matrix, pp and tg, on ROCm0
#   3. runs llama-perplexity on ROCm0 with each model on a fixed Wikitext-2 sample at batch 2048 and 4096
#   4. runs SPEED-Bench against llama-server with the MTP sidecar head for flash-next-iq2xs, on ROCm0
#   5. runs the same llama-bench matrix and a separate llama-perplexity measurement on Vulkan0, after all HIP work
#   6. uploads the raw logs as an artifact, converts them to one run.json, adds that run to the
#      bench-results branch and rebuilds the Pages site from all runs on that branch
#
# The test-backend-ops perf subset is a lane of its own: .github/workflows/bench-gfx1151-ops-perf.yml.
# It builds only test-backend-ops, runs the same subset, and keeps its own artifact, because a Vulkan
# device reset there must not cost this lane a 6 h run.
#
# Recipe. Models, quants and flags come from bench-gfx1151.yml and its PR172 comparison variant,
# which ran this model pair on the pool on 2026-10-16. Differences, on purpose:
#   - pp4096 with -b 4096 instead of pp2048 with a batch list. With pp2048, ub4096 runs one
#     2048-token ubatch and repeats the ub2048 cell. tg does not depend on ubatch, so the three tg
#     cells at one depth are repeats of one measurement.
#   - the model download URLs pin the Hugging Face revision, and the sha256 is checked.
#   - the Vulkan SDK version is pinned and its sha256 is checked; bench-gfx1151 takes "latest".
#   - one failed model does not stop the next model, and each llama-bench run has a 3 h timeout
#     instead of 2 h (the 27B model took 1 h 53 min on ROCm0 in run 39469034755).
#
#   key             repo                                 revision                                  file                            bytes        sha256
#   qwen36-35b-a3b  bartowski/Qwen_Qwen3.6-35B-A3B-GGUF  5c2410d71524f4f72b023ce8daf7a80528226d5f  Qwen_Qwen3.6-35B-A3B-Q8_0.gguf  37812647552  bc57de096ec30e45773aa86103f35a8a32cea01f2193a53a3c636d618e4434e9
#   qwen38-27b      unsloth/Qwen3.8-27B-GGUF             4ca720788d1e01f1bff70c033e0d0028fd02e502  Qwen3.8-27B-Q8_0.gguf           29047086048  a680f44a06920e5d689774823782006aa3acc8db95750323373b24139b67e348
#   flash-next-iq2xs  ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF  ed59f92082b1e93c0e96d60a8b11aab089b52f09  IQ2_XS/Qwen3.8-Flash-Next-GSQ-RCO-IQ2_XS-00001-of-00002.gguf  39225954592  92cee27ae5bbadcd732416a0f7a7f0acc092399dbbe8f5a5efa707c2ec0a49d7
#   flash-next-iq2xs  ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF  ed59f92082b1e93c0e96d60a8b11aab089b52f09  IQ2_XS/Qwen3.8-Flash-Next-GSQ-RCO-IQ2_XS-00002-of-00002.gguf  28800138432  316b46f3a2dbd68c900f43136ab9449f9dcc3725dfd8c794847c204bc161e113
# -lm dio is set for flash-next-iq2xs only, to keep a 68 GB mmap out of the load path.
#
# Perplexity: wiki.test.raw of the ggml-org/ci dataset (the file scripts/get-wikitext-2.sh and ci/run.sh
# use), pinned by revision and sha256; the first 32 chunks at -c 4096, with -b and -ub both 2048 and
# both 4096. The Vulkan number is a separate measurement, not a replacement for ROCm.
# At c4096 the two runs score the same tokens: b2048 cuts every chunk into two batches,
# b4096 runs it as one, so a PPL difference comes from the batch cut alone.
#
# SPEED-Bench: tools/server/bench/speed-bench (its client, taken from this workflow's own commit) against
# the llama-server this lane builds, for each model that has a SPEED-Bench config. The server runs -b/-ub
# 4096, -c 40960 (a 32k prompt plus a 4096 token output), f16 KV, -fa on, one slot, -md with the model's
# MTP draft head and --spec-type draft-mtp, so the decode number is MTP decode; without those the number is
# plain decode and not comparable. The GGUF of this lane carries no MTP tensor, so the head comes from a
# pinned sidecar in draft_spec() of model.sh (unsloth/Qwen3.8-Flash-Next-GGUF, self-contained Q4_K_M,
# 2.79 GB, verified by sha256). A model whose head cannot be downloaded is skipped with a `no-draft` row
# rather than measured without MTP. The client runs throughput_1k and throughput_32k with --category all
# and 2 samples per category, both against that one server so the model is loaded once. Draft acceptance
# comes from the server's own timings, so draft_n = 0 means MTP did not engage and the row is not an MTP
# number.
#
# Runner labels: `devlab-dispatch` reaches the AMD Ryzen AI Dev Lab pool, `strix-halo` selects Strix
# Halo hosts in it. Keep both. A wrong label does not fail, the job queues silently.
#
# Results live on the bench-results branch (runs/<key>/run.json plus the raw logs), never on master.
# The site is built from that branch on every run and deployed with actions/deploy-pages, so a
# generator change applies to all old runs. One-time setup: Settings -> Pages -> Source: GitHub
# Actions. The deploy job runs only for dispatches from the default branch, because by default the
# github-pages environment only accepts deployments from it.

name: Benchmark gfx1151 history (on-demand)
run-name: bench history / ${{ inputs.site_only && 'site only' || (inputs.ref || github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build and benchmark (empty = the commit this workflow runs from)'
        required: false
        default: ''
      models:
        description: 'Comma-separated subset of qwen36-35b-a3b,qwen38-27b,flash-next-iq2xs'
        required: false
        default: 'qwen36-35b-a3b,qwen38-27b,flash-next-iq2xs'
      ubatch:
        description: 'Comma-separated ubatch sizes (-ub), each 1..4096'
        required: false
        default: '1024,2048,4096'
      depths:
        description: 'Comma-separated context depths (-d)'
        required: false
        default: '0,40000,100000'
      reps:
        description: 'llama-bench repetitions per test (-r)'
        required: false
        default: '5'
      speed_bench:
        description: 'Run SPEED-Bench against llama-server with MTP for flash-next-iq2xs'
        required: false
        default: true
        type: boolean
      ppl:
        description: 'Run llama-perplexity on the Wikitext-2 sample at batch 2048 and 4096'
        required: false
        default: true
        type: boolean
      vulkan_ppl:
        description: 'Run llama-perplexity on Vulkan0 too, separately from the ROCm0 run (needs vulkan_bench)'
        required: false
        default: true
        type: boolean
      vulkan_bench:
        description: 'Run the llama-bench matrix on Vulkan0 too'
        required: false
        default: true
        type: boolean
      publish:
        description: 'Add the run to the bench-results branch and deploy the site'
        required: false
        default: true
        type: boolean
      site_only:
        description: 'Do not benchmark; only rebuild and deploy the site from bench-results'
        required: false
        default: false
        type: boolean

cache-mode: none
permissions:
  contents: read

env:
  RESULTS_BRANCH: bench-results

jobs:
  bench:
    name: bench / ${{ inputs.ref || github.ref_name }}
    if: ${{ !inputs.site_only }}
    runs-on: [self-hosted, Linux, devlab-dispatch, strix-halo]
    # expected about 6.5 h; the step timeouts bound a slow step so the later steps still get their time
    timeout-minutes: 1200
    # one benchmark at a time on the pool, shared with bench-gfx1151-ops-perf.yml through this literal
    # group name; GitHub keeps one pending run per group and cancels an older pending one
    concurrency:
      group: bench-gfx1151-devlab
      cancel-in-progress: false
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    env:
      BENCH_N_PROMPT: 4096
      BENCH_N_GEN: 256
      BENCH_N_BATCH: 4096
      PPL_CTX: 4096
      PPL_CHUNKS: 32
      PPL_BATCHES: 2048,4096
      # SPEED-Bench client settings, recorded in meta.env and read by scripts/bench-history/speed-bench.sh
      SPEED_BENCH_LIMIT: 2
      SPEED_BENCH_OSL: 4096
      # 32k prompt plus a 4096 token output, so the throughput_32k split fits in one slot
      SPEED_BENCH_CTX: 40960
      SPEED_BENCH_BATCH: 4096
      SPEED_BENCH_UBATCH: 4096
      SPEED_BENCH_SPEC: draft-mtp
      SPEED_BENCH_PORT: 8199
      WIKITEXT_ZIP_URL: https://huggingface.co/datasets/ggml-org/ci/resolve/927b3642933080f1b0e811e2f916e14c292992f9/wikitext-2-raw-v1.zip
      WIKITEXT_ZIP_SHA256: ef7edb566e3e2b2d31b29c1fdb0c89a4cc683597484c3dc2517919c615435a11
      WIKITEXT_TEST_SHA256: 173c87a53759e0201f33e0ccf978e510c2042d7f2cb78229d9a50d79b9e7dd08
      VULKAN_SDK_VERSION: 1.4.363.0
      VULKAN_SDK_SHA256: 197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43
      GGML_NLOOP: 3
      GGML_N_THREADS: 1
      LLAMA_ARG_LOG_COLORS: 0
      LLAMA_ARG_LOG_PREFIX: 1
      LLAMA_ARG_LOG_TIMESTAMPS: 1

    steps:
      - name: Validate inputs
        id: validate
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_MODELS: ${{ inputs.models }}
          INPUT_UBATCH: ${{ inputs.ubatch }}
          INPUT_DEPTHS: ${{ inputs.depths }}
          INPUT_REPS: ${{ inputs.reps }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          err() { echo "::error::$*" >&2; exit 2; }

          # prints the normalized, de-duplicated list
          int_list() {
            local name=$1 value=$2 min=$3 max=$4 out="" v
            local -a items
            IFS=',' read -ra items <<< "$value"
            for v in "${items[@]}"; do
              v=$(printf '%s' "$v" | tr -d '[:space:]')
              [ -n "$v" ] || continue
              case "$v" in *[!0-9]*) err "$name: '$v' is not a nonnegative integer" ;; esac
              [ "${#v}" -le 7 ] || err "$name: '$v' is out of range"
              v=$(( 10#$v ))
              { [ "$v" -ge "$min" ] && [ "$v" -le "$max" ]; } || err "$name: $v is outside $min..$max"
              case ",$out," in *",$v,"*) continue ;; esac
              out="${out:+$out,}$v"
            done
            [ -n "$out" ] || err "$name: the list is empty"
            printf '%s' "$out"
          }

          ref="$INPUT_REF"
          case "$ref" in *[!A-Za-z0-9._/+@-]*) err "ref '$ref' has characters outside [A-Za-z0-9._/+@-]" ;; esac
          [ "${#ref}" -le 200 ] || err "ref is longer than 200 characters"

          known="qwen36-35b-a3b qwen38-27b flash-next-iq2xs"
          models=""
          IFS=',' read -ra items <<< "$INPUT_MODELS"
          for m in "${items[@]}"; do
            m=$(printf '%s' "$m" | tr -d '[:space:]')
            [ -n "$m" ] || continue
            case " $known " in *" $m "*) ;; *) err "unknown model '$m'; choose from ${known// /,}" ;; esac
            case ",$models," in *",$m,"*) continue ;; esac
            models="${models:+$models,}$m"
          done
          [ -n "$models" ] || err "no model selected"

          ubatch=$(int_list ubatch "$INPUT_UBATCH" 1 "$BENCH_N_BATCH")
          depths=$(int_list depths "$INPUT_DEPTHS" 0 250000)
          reps=$(int_list reps "$INPUT_REPS" 1 100)
          case "$reps" in *,*) err "reps must be one number" ;; esac

          {
            echo "BENCH_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BENCH_REF=${ref:-$DISPATCH_REF}"
            echo "BENCH_MODELS=$models"
            echo "BENCH_UBATCH=$ubatch"
            echo "BENCH_DEPTHS=$depths"
            echo "BENCH_REPS=$reps"
          } >> "$GITHUB_ENV"
          echo "models=$models ubatch=$ubatch depths=$depths reps=$reps"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # the lane's own scripts, case list and SPEED-Bench client, which the measured ref may not have
      - name: Checkout the lane scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .bench-lane
          sparse-checkout: |
            scripts/bench-history
            tools/server/bench/speed-bench
          persist-credentials: false

      - name: Record run metadata
        env:
          INPUT_SPEED_BENCH: ${{ inputs.speed_bench }}
          INPUT_PPL: ${{ inputs.ppl }}
          INPUT_VULKAN_PPL: ${{ inputs.vulkan_ppl }}
          INPUT_VULKAN_BENCH: ${{ inputs.vulkan_bench }}
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/logs"
          mkdir -p "$logs"
          : > "$logs/commands.tsv"
          : > "$logs/results.tsv"
          : > "$logs/models.tsv"
          : > "$logs/drafts.tsv"
          git log -1 --format='%H%n%cI%n%s' > "$logs/commit.txt"
          {
            echo "schema=1"
            echo "started_utc=$BENCH_STARTED_UTC"
            echo "ref=$BENCH_REF"
            echo "commit=$(git rev-parse HEAD)"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "models=$BENCH_MODELS"
            echo "ubatch=$BENCH_UBATCH"
            echo "depths=$BENCH_DEPTHS"
            echo "reps=$BENCH_REPS"
            echo "n_prompt=$BENCH_N_PROMPT"
            echo "n_gen=$BENCH_N_GEN"
            echo "n_batch=$BENCH_N_BATCH"
            echo "speed_bench=$INPUT_SPEED_BENCH"
            echo "speed_bench_limit=$SPEED_BENCH_LIMIT"
            echo "speed_bench_osl=$SPEED_BENCH_OSL"
            echo "speed_bench_ctx=$SPEED_BENCH_CTX"
            echo "speed_bench_batch=$SPEED_BENCH_BATCH"
            echo "speed_bench_ubatch=$SPEED_BENCH_UBATCH"
            echo "spec_type=$SPEED_BENCH_SPEC"
            echo "ppl=$INPUT_PPL"
            echo "vulkan_ppl=$INPUT_VULKAN_PPL"
            echo "vulkan_bench=$INPUT_VULKAN_BENCH"
            echo "ppl_ctx=$PPL_CTX"
            echo "ppl_chunks=$PPL_CHUNKS"
            echo "ppl_batches=$PPL_BATCHES"
            echo "wikitext_sha256=$WIKITEXT_TEST_SHA256"
            echo "vulkan_sdk_version=$VULKAN_SDK_VERSION"
            echo "kernel=$(uname -r)"
            echo "nproc=$(nproc)"
            echo "mem_total_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
            echo "hip_version=$(hipconfig --version 2> /dev/null | head -1 || true)"
            echo "cmake_version=$(cmake --version | head -1)"
          } > "$logs/meta.env"
          # the SPEED-Bench configs each model will be measured with, so collect.py knows what to look for
          for m in ${BENCH_MODELS//,/ }; do
            b=$(bash .bench-lane/scripts/bench-history/model.sh speed "$m" 2> /dev/null) || b=""
            [ -z "$b" ] || echo "speed_bench_benches_$m=$b" >> "$logs/meta.env"
          done
          cat "$logs/meta.env"

          # diagnostics only, so a missing probe does not fail the job
          {
            git log --oneline -1
            uname -a
            nproc
            free -g
            df -h "$RUNNER_TEMP" .
            rocminfo | grep -E '^  Name|Marketing Name' | head -6
            rocm-smi --showproductname | head -8
            cmake --version | head -1
            hipconfig --version
          } > "$logs/environment.log" 2>&1 || true

          {
            echo "### Benchmark gfx1151 history"
            echo
            echo "- ref: \`$BENCH_REF\`"
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- runner: \`$RUNNER_NAME\`"
            echo "- models: \`$BENCH_MODELS\`"
            echo "- ubatch: \`$BENCH_UBATCH\`, depths: \`$BENCH_DEPTHS\`, reps: \`$BENCH_REPS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build (HIP)
        id: build_hip
        timeout-minutes: 45
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/logs"
          quote() { local s; s=$(printf '%q ' "$@"); printf '%s' "${s% }"; }

          # same flags as the hip branch of bench-gfx1151.yml, plus the server the SPEED-Bench step drives
          configure=(cmake -B build-hip -S .
            -DCMAKE_BUILD_TYPE=Release
            -DGGML_HIP=ON -DGGML_VULKAN=OFF -DGGML_CUDA=OFF
            "-DCMAKE_HIP_COMPILER=$(hipconfig -l)/clang"
            -DGPU_TARGETS=gfx1151
            -DGGML_HIP_EXPORT_METRICS=Off
            -DLLAMA_BUILD_COMMON=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_TESTS=ON
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON)
          build=(cmake --build build-hip --config Release -j "$(nproc)" --target llama-bench llama-perplexity llama-server)

          printf 'build-hip-configure\t%s\n' "$(quote "${configure[@]}")" >> "$logs/commands.tsv"
          printf 'build-hip\t%s\n' "$(quote "${build[@]}")" >> "$logs/commands.tsv"
          "${configure[@]}" 2>&1 | tee "$logs/build-hip-configure.log"
          "${build[@]}" > "$logs/build-hip-make.log" 2>&1 || { tail -100 "$logs/build-hip-make.log"; exit 1; }
          tail -5 "$logs/build-hip-make.log"

      - name: Detect GPU device (HIP)
        id: device_hip
        run: |
          set -uo pipefail
          logs="$RUNNER_TEMP/logs"
          rc=0
          ./build-hip/bin/llama-bench --list-devices > "$logs/devices-hip.txt" 2>&1 || rc=$?
          cat "$logs/devices-hip.txt"
          if [ "$rc" -ne 0 ]; then
            echo "::error::llama-bench --list-devices failed (exit $rc)" >&2
            exit "$rc"
          fi
          if ! grep -qE '^  ROCm0:' "$logs/devices-hip.txt"; then
            echo "::error::ROCm0 is not registered; the HIP backend did not build in or found no GPU" >&2
            exit 1
          fi

      - name: Provide the Vulkan toolchain
        id: vulkan_sdk
        if: ${{ !cancelled() && inputs.vulkan_bench && steps.checkout.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          # the pool has Mesa and the loader but no glslc, headers, SPIRV-Headers config or
          # passwordless sudo, so unpack the Lunarg SDK into $RUNNER_TEMP (recipe from bench-gfx1151)
          set -euo pipefail
          logs="$RUNNER_TEMP/logs"
          log="$logs/vulkan-env.log"
          tarball="$RUNNER_TEMP/vulkan_sdk.tar.xz"
          curl -fsSL --retry 5 --retry-delay 5 -o "$tarball" \
            "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkan_sdk.tar.xz"
          echo "$VULKAN_SDK_SHA256  $tarball" | sha256sum -c - | tee "$log"
          mkdir -p "$RUNNER_TEMP/vulkan_sdk"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/vulkan_sdk"
          glslc_path=$(find "$RUNNER_TEMP/vulkan_sdk" -type f -name glslc -print -quit)
          if [ -z "$glslc_path" ]; then
            echo "::error::no glslc in the SDK tarball" >&2
            exit 1
          fi
          sdk_root=$(dirname "$(dirname "$glslc_path")")
          # PATH and LD_LIBRARY_PATH are set by the Vulkan steps themselves, so the HIP steps keep a clean environment
          echo "VULKAN_SDK=$sdk_root" >> "$GITHUB_ENV"
          # FindVulkan wants an unversioned libvulkan.so; the runner has only the versioned loader
          vk_lib=""
          for lib in "$sdk_root/lib/libvulkan.so" "$sdk_root"/x86_64/lib/libvulkan.so /usr/lib/x86_64-linux-gnu/libvulkan.so /lib/x86_64-linux-gnu/libvulkan.so; do
            if [ -f "$lib" ]; then
              vk_lib="$lib"
              break
            fi
          done
          if [ -z "$vk_lib" ]; then
            for lib in "$sdk_root"/lib/libvulkan.so.1 "$sdk_root"/x86_64/lib/libvulkan.so.1 /usr/lib/x86_64-linux-gnu/libvulkan.so.1 /lib/x86_64-linux-gnu/libvulkan.so.1; do
              if [ -f "$lib" ]; then
                mkdir -p "$RUNNER_TEMP/vkdev"
                ln -sf "$lib" "$RUNNER_TEMP/vkdev/libvulkan.so"
                vk_lib="$RUNNER_TEMP/vkdev/libvulkan.so"
                break
              fi
            done
          fi
          if [ -z "$vk_lib" ]; then
            echo "::error::no Vulkan loader found in the SDK or system library paths" >&2
            exit 1
          fi
          echo "VULKAN_LIBRARY=$vk_lib" >> "$GITHUB_ENV"
          {
            echo "VULKAN_SDK=$sdk_root"
            echo "VULKAN_LIBRARY=$vk_lib"
            "$sdk_root/bin/glslc" --version | head -2
            if [ -x "$sdk_root/bin/vulkaninfo" ]; then
              "$sdk_root/bin/vulkaninfo" --summary 2>&1 | head -40 || true
            fi
          } 2>&1 | tee -a "$log"

      - name: Build (Vulkan)
        id: build_vulkan
        if: ${{ !cancelled() && steps.vulkan_sdk.outcome == 'success' }}
        timeout-minutes: 45
        run: |
          set -euo pipefail
          export PATH="$VULKAN_SDK/bin:$PATH"
          export LD_LIBRARY_PATH="$VULKAN_SDK/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          logs="$RUNNER_TEMP/logs"
          quote() { local s; s=$(printf '%q ' "$@"); printf '%s' "${s% }"; }

          # same flags as the vulkan branch of bench-gfx1151.yml
          configure=(cmake -B build-vulkan -S .
            -DCMAKE_BUILD_TYPE=Release
            -DGGML_VULKAN=ON -DGGML_HIP=OFF -DGGML_CUDA=OFF
            "-DVulkan_LIBRARY=$VULKAN_LIBRARY"
            -DLLAMA_BUILD_COMMON=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_TESTS=ON
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF)
          build=(cmake --build build-vulkan --config Release -j "$(nproc)" --target llama-bench llama-perplexity)

          printf 'build-vulkan-configure\t%s\n' "$(quote "${configure[@]}")" >> "$logs/commands.tsv"
          printf 'build-vulkan\t%s\n' "$(quote "${build[@]}")" >> "$logs/commands.tsv"
          "${configure[@]}" 2>&1 | tee "$logs/build-vulkan-configure.log"
          "${build[@]}" > "$logs/build-vulkan-make.log" 2>&1 || { tail -100 "$logs/build-vulkan-make.log"; exit 1; }
          tail -5 "$logs/build-vulkan-make.log"

      - name: Detect GPU device (Vulkan)
        id: device_vulkan
        if: ${{ !cancelled() && steps.build_vulkan.outcome == 'success' }}
        run: |
          set -uo pipefail
          export LD_LIBRARY_PATH="$VULKAN_SDK/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          logs="$RUNNER_TEMP/logs"
          rc=0
          ./build-vulkan/bin/llama-bench --list-devices > "$logs/devices-vulkan.txt" 2>&1 || rc=$?
          cat "$logs/devices-vulkan.txt"
          if [ "$rc" -ne 0 ]; then
            echo "::error::llama-bench --list-devices failed (exit $rc)" >&2
            exit "$rc"
          fi
          if ! grep -qE '^  Vulkan0:' "$logs/devices-vulkan.txt"; then
            echo "::error::Vulkan0 is not registered; the Vulkan backend did not build in or found no GPU" >&2
            exit 1
          fi

      - name: Fetch the Wikitext-2 sample
        id: wikitext
        if: ${{ !cancelled() && inputs.ppl && steps.device_hip.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/wikitext"
          mkdir -p "$dir"
          curl -fsSL --retry 5 --retry-delay 5 -o "$dir/wikitext-2-raw-v1.zip" "$WIKITEXT_ZIP_URL"
          echo "$WIKITEXT_ZIP_SHA256  $dir/wikitext-2-raw-v1.zip" | sha256sum -c -
          # python3 is on the runner (rocm-smi is a python script); unzip is not known to be
          python3 -I -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extract("wikitext-2-raw/wiki.test.raw", sys.argv[2])' \
            "$dir/wikitext-2-raw-v1.zip" "$dir"
          echo "$WIKITEXT_TEST_SHA256  $dir/wikitext-2-raw/wiki.test.raw" | sha256sum -c -
          echo "WIKITEXT_FILE=$dir/wikitext-2-raw/wiki.test.raw" >> "$GITHUB_ENV"

      # the client needs datasets, requests and tqdm; a venv keeps them off the runner's own python
      - name: Set up the SPEED-Bench client
        id: speed_setup
        if: ${{ !cancelled() && inputs.speed_bench && steps.device_hip.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/logs/speed-bench-setup.log"
          client=.bench-lane/tools/server/bench/speed-bench
          pip_args=(--disable-pip-version-check -q -r "$client/requirements.txt")
          if python3 -m venv "$RUNNER_TEMP/sbvenv" >> "$log" 2>&1; then
            python="$RUNNER_TEMP/sbvenv/bin/python"
            "$python" -m pip install "${pip_args[@]}" >> "$log" 2>&1
          else
            # no venv module on this image: fall back to the user site of the system python
            echo "python3 -m venv failed, installing into the user site" >> "$log"
            python=python3
            python3 -m pip install --user "${pip_args[@]}" >> "$log" 2>&1
          fi
          if ! "$python" -c 'import datasets, requests, tqdm' >> "$log" 2>&1; then
            tail -20 "$log"
            echo "::error::SPEED-Bench client dependencies are not importable with $python"
            exit 1
          fi
          echo "SPEED_PYTHON=$python" >> "$GITHUB_ENV"
          echo "SPEED-Bench client ready: $python"

      - name: Download models, run llama-bench and llama-perplexity (HIP)
        id: bench
        if: ${{ !cancelled() && steps.device_hip.outcome == 'success' }}
        timeout-minutes: 360
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_CI }}
          RUN_PPL: ${{ inputs.ppl }}
          RUN_SPEED_BENCH: ${{ inputs.speed_bench && steps.speed_setup.outcome == 'success' }}
          KEEP_MODELS: ${{ inputs.vulkan_bench && steps.device_vulkan.outcome == 'success' }}
        run: |
          # the runner starts bash with -e; drop it so one failed model does not stop the next
          set +e
          set -uo pipefail
          logs="$RUNNER_TEMP/logs"
          model=.bench-lane/scripts/bench-history/model.sh
          quote() { local s; s=$(printf '%q ' "$@"); printf '%s' "${s% }"; }
          failed=0
          IFS=',' read -ra want <<< "$BENCH_MODELS"
          for i in "${!want[@]}"; do
            name=${want[$i]}
            if ! path=$(bash "$model" fetch "$name"); then
              printf 'llama-bench\t%s\tskipped\t0\n' "$name" >> "$logs/results.tsv"
              failed=1
              continue
            fi
            bash "$model" bench llama-bench ./build-hip/bin/llama-bench "$name" "$path" || failed=1

            if [ "$RUN_PPL" = "true" ]; then
              for b in ${PPL_BATCHES//,/ }; do
                if [ ! -s "${WIKITEXT_FILE:-}" ]; then
                  echo "::error::SKIP llama-perplexity $name b$b: no Wikitext-2 sample"
                  printf 'perplexity\t%s\t%s\tno-wikitext\t\n' "$name" "$b" >> "$logs/results.tsv"
                  failed=1
                  continue
                fi
                extra=$(bash "$model" flags "$name")
                cmd=(timeout 3600 ./build-hip/bin/llama-perplexity -m "$path" -f "$WIKITEXT_FILE" -c "$PPL_CTX" --chunks "$PPL_CHUNKS" -b "$b" -ub "$b" -lzm on-direct -ngl 99 -fa on -ctk f16 -ctv f16)
                # shellcheck disable=SC2206
                [ -z "$extra" ] || cmd+=($extra)
                printf 'perplexity-%s-b%s\t%s\n' "$name" "$b" "$(quote "${cmd[@]}")" >> "$logs/commands.tsv"
                echo "=== llama-perplexity $name b$b ==="
                t0=$(date +%s.%N)
                "${cmd[@]}" > "$logs/perplexity-$name-b$b.log" 2>&1
                rc=$?
                wall=$(awk -v a="$t0" -v b="$(date +%s.%N)" 'BEGIN { printf "%.1f", b - a }')
                final=$(grep -oE 'Final estimate: PPL = [0-9.]+ \+/- [0-9.]+' "$logs/perplexity-$name-b$b.log" | tail -1)
                printf 'perplexity\t%s\t%s\t%s\t%s\n' "$name" "$b" "$rc" "$wall" >> "$logs/results.tsv"
                echo "$name b$b: exit $rc, $wall s, ${final:-no final estimate}"
                # perplexity exits 0 without a result when the text is too short, so require the final line
                if [ "$rc" -ne 0 ] || [ -z "$final" ]; then
                  tail -20 "$logs/perplexity-$name-b$b.log"
                  echo "::error::llama-perplexity failed for $name b$b (exit $rc)"
                  failed=1
                fi
              done
            fi
            # MTP decode on the same file, before this model is dropped for the Vulkan pass. The GGUFs of
            # this lane carry no MTP head, so the server takes a sidecar head with -md; without one the
            # decode number would not be MTP and is not recorded.
            if [ "$RUN_SPEED_BENCH" = "true" ] && sb=$(bash "$model" speed "$name"); then
              if draft=$(bash "$model" draft "$name"); then
                # shellcheck disable=SC2046
                SPEED_BENCH_BENCHES="$sb" SPEED_MTP_DRAFT="$draft" \
                  bash .bench-lane/scripts/bench-history/speed-bench.sh \
                  ./build-hip/bin/llama-server .bench-lane/tools/server/bench/speed-bench "${SPEED_PYTHON:-python3}" \
                  "$name" "$path" "$logs/speed-bench-$name" $(bash "$model" flags "$name") || failed=1
              else
                echo "::error::SKIP SPEED-Bench $name: no MTP draft head, the decode number would not be MTP"
                for b in ${sb//,/ }; do
                  printf 'speed-bench\t%s\t%s\tno-draft\t0\n' "$name" "$b" >> "$logs/results.tsv"
                done
                failed=1
              fi
              rm -rf "$RUNNER_TEMP/models/$name-mtp"
            fi
            # keep the file for the Vulkan llama-bench only while the next models still fit on the disk;
            # the Vulkan step downloads a dropped file again
            if [ "$KEEP_MODELS" = "true" ] && bash "$model" fits "${want[@]:i+1}"; then
              echo "keeping $name for the Vulkan llama-bench"
            else
              rm -rf "$RUNNER_TEMP/models/$name"
            fi
          done
          exit "$failed"

      - name: llama-bench and llama-perplexity (Vulkan)
        id: bench_vulkan
        if: ${{ !cancelled() && inputs.vulkan_bench && steps.device_vulkan.outcome == 'success' }}
        timeout-minutes: 480
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_CI }}
          RUN_VULKAN_PPL: ${{ inputs.vulkan_ppl }}
          RUN_PPL: ${{ inputs.ppl }}
        run: |
          # after all HIP work, so a Vulkan failure or device reset cannot touch the HIP numbers
          set +e
          set -uo pipefail
          export LD_LIBRARY_PATH="$VULKAN_SDK/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          logs="$RUNNER_TEMP/logs"
          model=.bench-lane/scripts/bench-history/model.sh
          quote() { local s; s=$(printf '%q ' "$@"); printf '%s' "${s% }"; }
          failed=0
          IFS=',' read -ra want <<< "$BENCH_MODELS"
          # files the HIP step kept first, so their space is free before a dropped file is downloaded again
          kept=()
          dropped=()
          for name in "${want[@]}"; do
            # key, repo, revision, file, bytes, sha256, actual sha256, status (first record per model)
            row=$(awk -F'\t' -v n="$name" '$1 == n { print $4 "\t" $8; exit }' "$logs/models.tsv")
            file=${row%%$'\t'*}
            status=${row#*$'\t'}
            if [ "$status" != "verified" ]; then
              echo "::error::SKIP Vulkan llama-bench $name: the HIP step could not use the model (${status:-not fetched})"
              printf 'llama-bench-vulkan\t%s\tskipped-%s\t0\n' "$name" "${status:-not-fetched}" >> "$logs/results.tsv"
              failed=1
            elif bash "$model" have "$name" > /dev/null; then
              kept+=("$name")
            else
              dropped+=("$name")
            fi
          done
          for name in "${kept[@]}" "${dropped[@]}"; do
            path=$(bash "$model" have "$name" 2> /dev/null)
            [ -n "$path" ] || path=$(find "$RUNNER_TEMP/models/$name" -name '*.gguf' -print -quit 2> /dev/null)
            if [ -z "$path" ] && ! path=$(bash "$model" fetch "$name"); then
              printf 'llama-bench-vulkan\t%s\tskipped-download\t0\n' "$name" >> "$logs/results.tsv"
              failed=1
              continue
            fi
            bash "$model" bench llama-bench-vulkan ./build-vulkan/bin/llama-bench "$name" "$path" || failed=1

            if [ "$RUN_PPL" = "true" ] && [ "$RUN_VULKAN_PPL" = "true" ]; then
              for b in ${PPL_BATCHES//,/ }; do
                if [ ! -s "${WIKITEXT_FILE:-}" ]; then
                  echo "::error::SKIP llama-perplexity $name b$b: no Wikitext-2 sample"
                  printf 'perplexity-vulkan\t%s\t%s\tno-wikitext\t\n' "$name" "$b" >> "$logs/results.tsv"
                  failed=1
                  continue
                fi
                extra=$(bash "$model" flags "$name")
                cmd=(timeout 3600 ./build-vulkan/bin/llama-perplexity -m "$path" -f "$WIKITEXT_FILE" -c "$PPL_CTX" --chunks "$PPL_CHUNKS" -b "$b" -ub "$b" -lzm on-direct -ngl 99 -fa on -ctk f16 -ctv f16)
                # shellcheck disable=SC2206
                [ -z "$extra" ] || cmd+=($extra)
                printf 'perplexity-vulkan-%s-b%s\t%s\n' "$name" "$b" "$(quote "${cmd[@]}")" >> "$logs/commands.tsv"
                echo "=== llama-perplexity $name b$b ==="
                t0=$(date +%s.%N)
                "${cmd[@]}" > "$logs/perplexity-vulkan-$name-b$b.log" 2>&1
                rc=$?
                wall=$(awk -v a="$t0" -v b="$(date +%s.%N)" 'BEGIN { printf "%.1f", b - a }')
                final=$(grep -oE 'Final estimate: PPL = [0-9.]+ \+/- [0-9.]+' "$logs/perplexity-vulkan-$name-b$b.log" | tail -1)
                printf 'perplexity-vulkan\t%s\t%s\t%s\t%s\n' "$name" "$b" "$rc" "$wall" >> "$logs/results.tsv"
                echo "$name b$b: exit $rc, $wall s, ${final:-no final estimate}"
                # perplexity exits 0 without a result when the text is too short, so require the final line
                if [ "$rc" -ne 0 ] || [ -z "$final" ]; then
                  tail -20 "$logs/perplexity-vulkan-$name-b$b.log"
                  echo "::error::llama-perplexity failed for $name b$b (exit $rc)"
                  failed=1
                fi
              done
            fi
            rm -rf "$RUNNER_TEMP/models/$name"
          done
          exit "$failed"

      - name: Write run manifest
        if: ${{ always() }}
        env:
          S_VALIDATE: ${{ steps.validate.outcome }}
          S_BUILD_HIP: ${{ steps.build_hip.outcome }}
          S_DEVICE_HIP: ${{ steps.device_hip.outcome }}
          S_VULKAN_SDK: ${{ steps.vulkan_sdk.outcome }}
          S_BUILD_VULKAN: ${{ steps.build_vulkan.outcome }}
          S_DEVICE_VULKAN: ${{ steps.device_vulkan.outcome }}
          S_WIKITEXT: ${{ steps.wikitext.outcome }}
          S_SPEED_SETUP: ${{ steps.speed_setup.outcome }}
          S_BENCH: ${{ steps.bench.outcome }}
          S_BENCH_VULKAN: ${{ steps.bench_vulkan.outcome }}
        run: |
          logs="$RUNNER_TEMP/logs"
          mkdir -p "$logs"
          {
            printf 'validate\t%s\n' "$S_VALIDATE"
            printf 'build-hip\t%s\n' "$S_BUILD_HIP"
            printf 'device-hip\t%s\n' "$S_DEVICE_HIP"
            printf 'vulkan-sdk\t%s\n' "$S_VULKAN_SDK"
            printf 'build-vulkan\t%s\n' "$S_BUILD_VULKAN"
            printf 'device-vulkan\t%s\n' "$S_DEVICE_VULKAN"
            printf 'wikitext\t%s\n' "$S_WIKITEXT"
            printf 'speed-bench-setup\t%s\n' "$S_SPEED_SETUP"
            printf 'models-hip\t%s\n' "$S_BENCH"
            printf 'llama-bench-vulkan\t%s\n' "$S_BENCH_VULKAN"
          } > "$logs/steps.tsv"
          echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$logs/meta.env"
          cat "$logs/steps.tsv"

      - name: Upload raw logs
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/logs
          retention-days: 90
          if-no-files-found: warn

  publish:
    name: publish
    needs: bench
    if: ${{ !cancelled() && (inputs.site_only || needs.bench.outputs.artifact_id != '') }}
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    outputs:
      pages: ${{ steps.pages.outcome }}

    steps:
      - name: Checkout the site scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/bench-history
          persist-credentials: false

      - name: Download raw logs
        if: ${{ !inputs.site_only }}
        uses: actions/download-artifact@v8
        with:
          name: bench-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: raw

      - name: Build run.json
        id: collect
        if: ${{ !inputs.site_only }}
        env:
          ARTIFACT_URL: ${{ needs.bench.outputs.artifact_url }}
        run: |
          set -euo pipefail
          key=$(python3 scripts/bench-history/collect.py --raw raw --out run --artifact-url "$ARTIFACT_URL")
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "run key: $key"

      - name: Upload run.json
        if: ${{ steps.collect.outputs.key != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-history-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: run
          retention-days: 90

      - name: Update the results branch
        if: ${{ inputs.site_only || (inputs.publish && steps.collect.outputs.key != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS_REMOTE: ${{ github.server_url }}/${{ github.repository }}
          RUN_KEY: ${{ steps.collect.outputs.key }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          # start from the remote tip, or from an empty orphan branch if the branch does not exist yet
          fetch_results() {
            rm -rf results
            git init -q results
            git -C results config http.extraheader "$auth"
            git -C results remote add origin "$RESULTS_REMOTE"
            local rc=0
            git -C results ls-remote --exit-code --heads origin "$RESULTS_BRANCH" > /dev/null || rc=$?
            if [ "$rc" -eq 0 ]; then
              git -C results fetch -q --depth 1 origin "$RESULTS_BRANCH"
              git -C results checkout -q -B "$RESULTS_BRANCH" FETCH_HEAD
            elif [ "$rc" -eq 2 ]; then
              git -C results checkout -q --orphan "$RESULTS_BRANCH"
              printf '%s\n' "# Benchmark results" "" \
                "Written by .github/workflows/bench-gfx1151-history.yml on the default branch. One directory per run under runs/." \
                "Do not merge this branch anywhere; the Pages site is built from it." > results/README.md
            else
              return "$rc"
            fi
          }

          if [ -z "$RUN_KEY" ]; then
            fetch_results
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if fetch_results; then
              mkdir -p results/runs
              rm -rf "results/runs/$RUN_KEY"
              cp -r "run/$RUN_KEY" "results/runs/$RUN_KEY"
              git -C results add -A
              if git -C results diff --cached --quiet; then
                echo "run $RUN_KEY is already on $RESULTS_BRANCH"
                exit 0
              fi
              # [skip ci]: workflows with push triggers must not run for a results commit
              git -C results -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -q -m "bench : add run $RUN_KEY [skip ci]"
              if git -C results push -q origin "HEAD:refs/heads/$RESULTS_BRANCH"; then
                echo "pushed run $RUN_KEY to $RESULTS_BRANCH"
                exit 0
              fi
            fi
            echo "attempt $attempt failed, retrying"
            sleep $(( attempt * 10 ))
          done
          echo "::error::could not push run $RUN_KEY to $RESULTS_BRANCH" >&2
          exit 1

      - name: Build the site
        if: ${{ inputs.site_only || (inputs.publish && steps.collect.outputs.key != '') }}
        run: |
          python3 scripts/bench-history/build_site.py --results results --out _site \
            --repository "$GITHUB_REPOSITORY" --server-url "$GITHUB_SERVER_URL" --branch "$RESULTS_BRANCH"

      - name: Upload the site
        id: pages
        if: ${{ inputs.site_only || (inputs.publish && steps.collect.outputs.key != '') }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy pages
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.pages == 'success' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
